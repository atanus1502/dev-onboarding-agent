display_information:
  name: Onboarding Agent
  description: Answers new-hire questions from our code and wiki, and walks you through local setup.
features:
  bot_user:
    display_name: onboarding
    always_online: true
  slash_commands:
    - command: /onboarding
      description: Repos you can access, setup progress and help
      usage_hint: "help | repos | setup <repo> | progress"
      should_escape: false
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - commands
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events: [app_mention, message.im, reaction_added]
  socket_mode_enabled: true
