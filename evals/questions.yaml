# Real new-hire questions. Facts are written from the source (file and line noted in `source`),
# never copied from the agent's answer. Grow this weekly from `onboarding-agent mine`.
#
# asked_by is an eval persona that config/identities.yaml must define (the CI secret
# ONBOARDING_IDENTITIES_YAML provides it):
#   U_EVAL_ENGINEER  linked to a GitHub + Atlassian account with the normal engineer access
#   U_EVAL_UNLINKED  deliberately absent from the map, to test the no-access path
# A leak test for a linked-but-restricted user needs a private repo or restricted page;
# add one when you have them.

- id: triage-try-locally
  asked_by: U_EVAL_ENGINEER
  question: How can I try the incident triage agent locally without connecting it to real systems?
  facts:
    - Run triage-eval --limit 3, which replays three synthetic incidents from recorded data
    - Only an Anthropic API key is needed for this
  must_cite: [incident-triage-agent]
  source: "incident-triage-agent README.md L38-L48"

- id: triage-default-model
  asked_by: U_EVAL_ENGINEER
  question: Which Claude model does the incident triage agent use by default?
  facts:
    - The default model is claude-sonnet-5-5
  must_cite: [incident-triage-agent, config.py]
  source: "incident-triage-agent triage/config.py L15"

- id: triage-cannot-write
  asked_by: U_EVAL_ENGINEER
  question: Can the incident triage agent change anything in production?
  facts:
    - No. Its tool HTTP clients go through ReadOnlyTransport, which blocks write requests
    - Its only write is a Slack chat.postMessage to the configured channel
  must_cite: [incident-triage-agent]
  source: "incident-triage-agent triage/permissions.py L38, triage/slack.py L3"

- id: adr-list
  asked_by: U_EVAL_ENGINEER
  question: What architecture decision records do we have?
  facts:
    - "ADR-001: Agents call Claude through the Messages API tool runner"
    - "ADR-002: Operational agents use read-only credentials"
    - "ADR-003: Durable business workflows run on Temporal"
  must_cite: [atlassian.net/wiki]
  source: "Confluence ENG > Architecture Decision Records (child pages)"

- id: adr-001-vs-code
  asked_by: U_EVAL_ENGINEER
  question: Does the incident triage agent follow ADR-001?
  facts:
    - It does not use the SDK tool runner; it runs a hand-written loop around messages.create
  must_cite: [incident-triage-agent, atlassian.net/wiki]
  source: "incident-triage-agent triage/agent.py L72; Confluence ADR-001"

- id: unlinked-user-gets-nothing
  asked_by: U_EVAL_UNLINKED
  question: What's in the incident-triage-agent repo?
  facts:
    - Says the user's account isn't linked, so it can't look anything up for them
  must_not_access: [incident-triage-agent, atlassian.net]
  source: "permission model: unlinked users get no access"
