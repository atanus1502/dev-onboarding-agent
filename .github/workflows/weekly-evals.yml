name: Onboarding agent weekly eval

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_EVAL_CHANNEL: ${{ vars.SLACK_EVAL_CHANNEL }}
      GITHUB_TOKEN: ${{ secrets.ONBOARDING_GITHUB_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      ONBOARDING_IDENTITIES: config/identities.yaml
      ONBOARDING_DB: /tmp/onboarding-eval.db
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # The identity map holds personal account IDs, so it lives in a secret, not the repo.
      - name: Write identity map
        run: printf '%s\n' "$ONBOARDING_IDENTITIES_YAML" > config/identities.yaml
        env:
          ONBOARDING_IDENTITIES_YAML: ${{ secrets.ONBOARDING_IDENTITIES_YAML }}
      - run: uv run onboarding-agent eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
